<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- X Router icon sprite — no emoji, all vector, subtle motion -->

  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <rect x="3" y="3" width="7" height="7" rx="1.5"/>
    <rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/>
    <rect x="14" y="14" width="7" height="7" rx="1.5"/>
  </symbol>

  <symbol id="i-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M9 3v5M15 3v5"/>
    <path d="M6 8h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8z"/>
    <path d="M12 17v4"/>
    <circle class="pulse" cx="12" cy="11" r="2.2"/>
  </symbol>

  <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="8" cy="12" r="4"/>
    <path d="M12 12h9M17 12v3M20.5 12v2.5"/>
  </symbol>

  <symbol id="i-logs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path class="trace" d="M3 12h4l2.5-6 3 12 2.5-6h6"/>
  </symbol>

  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/>
    <path d="M10 8l-4 4 4 4M6 12h9"/>
  </symbol>

  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>

  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
    <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>
  </symbol>

  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>
    <path class="draw" d="M9 12l2 2 4-4"/>
  </symbol>

  <symbol id="i-chip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <rect x="6" y="6" width="12" height="12" rx="2"/>
    <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
    <circle class="blink" cx="12" cy="12" r="2"/>
  </symbol>

  <symbol id="i-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="5" cy="12" r="2.2"/>
    <circle cx="19" cy="6" r="2.2"/>
    <circle cx="19" cy="18" r="2.2"/>
    <path d="M7 11.2 17 6.8M7 12.8 17 17.2" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </symbol>

  <symbol id="i-empty" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <rect x="8" y="12" width="32" height="24" rx="3"/>
    <path d="M8 20h32M14 27h8M14 31h14"/>
    <path class="sweep" d="M8 12 40 36" opacity="0.35"/>
  </symbol>
</svg>
